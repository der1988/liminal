<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/favicon.svg" />
    <title>L’osservatore di vite</title>
  </head>
  <body>
    <canvas
      id="space"
      aria-label="Universo di anime autonome. Seleziona un punto per osservarlo; trascina per esplorare e usa la rotella per avvicinarti."
    ></canvas>
    <nav id="time" aria-label="Tempo della simulazione">
      <button data-speed="0" aria-label="Pausa">
        <svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true">
          <path d="M3 1v10M7 1v10" stroke="currentColor" stroke-width="1" />
        </svg></button
      ><button data-speed="1" aria-pressed="true">1×</button
      ><button data-speed="3" aria-pressed="false">3×</button
      ><button data-speed="8" aria-pressed="false">8×</button
      ><output id="year">anno 0</output>
    </nav>
    <aside id="person" hidden aria-label="Persona selezionata">
      <button id="close" aria-label="Chiudi scheda">×</button>
      <h2 id="name"></h2>
      <span id="named-badge" hidden>nome affidato</span>
      <p id="age"></p>
      <button id="follow">Segui</button>
      <div id="person-body"></div>
    </aside>
    <nav id="actions" aria-label="Osservazione">
      <button
        id="birth"
        aria-label="Dai un nome a una nuova anima"
        title="Dai un nome a una nuova anima"
      >
        +</button
      ><button
        id="search"
        aria-label="Cerca le anime nominate"
        aria-expanded="false"
        aria-controls="archive"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8" cy="8" r="5" />
          <path d="m12 12 5 5" />
        </svg>
      </button>
    </nav>
    <section id="archive" hidden aria-label="Archivio delle anime nominate">
      <button id="close-search" aria-label="Chiudi ricerca">×</button
      ><label for="query">I nomi affidati</label
      ><input id="query" placeholder="Cerca un nome" autocomplete="off" />
      <div id="results"></div>
    </section>
    <div id="pending" aria-live="polite"></div>
    <dialog id="birth-dialog">
      <form id="birth-form">
        <label for="birth-name">Come si chiamerà?</label
        ><input id="birth-name" maxlength="40" required autocomplete="off" />
        <div class="form-actions">
          <button type="button" id="cancel-name">Annulla</button
          ><button type="submit">Affida il nome</button>
        </div>
      </form>
    </dialog>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
